# Story 2.8: `docker compose up`, then localhost:8080 — the whole command.

services:
  fitfix:
    build: .
    image: fitfix
    ports:
      # The same number on both sides, so the URL in the README is the URL the service logs.
      - "8080:8080"

    # AD-3 and AD-11, enforced rather than intended: an uploaded file is held in memory,
    # because MemoryBufferThreshold is the whole upload bound, and nothing of a repair is
    # kept. A filesystem that cannot be written is what turns a regression in either of those
    # into a crash instead of a quiet temporary file. There is no volume for the same reason:
    # the service carries nothing from one request to the next.
    read_only: true
    tmpfs:
      # The runtime may want somewhere of its own. Nothing of ours goes here, and it leaves
      # with the container.
      - /tmp

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The upload bound is 20 MB by default (AD-13). A deployment that wants another one
      # sets it here and nowhere else.
      # FITFIX_MAX_UPLOAD_BYTES: "20971520"

      # How often one client may ask, and how many /api requests are served at once. The
      # defaults are in RateLimits.Defaults and are meant for one small public machine;
      # nothing needs to be set here to have them.
      # FITFIX_RATE_INSPECT_PERMITS: "60"
      # FITFIX_RATE_INSPECT_WINDOW_SECONDS: "60"
      # FITFIX_RATE_REPAIR_PERMITS: "20"
      # FITFIX_RATE_REPAIR_WINDOW_SECONDS: "300"
      # FITFIX_RATE_CONCURRENCY: "2"
      # FITFIX_RATE_QUEUE: "4"

      # Which peers may speak for a client with X-Forwarded-For. Unset — as here, where the
      # port is published straight onto the host — means the socket's own address is the
      # client's, so nobody can own a rate-limiting partition by sending a header. Behind a
      # proxy that is the only way in (Caddy on loopback, a platform's router), set it to the
      # proxy's address or network, or to "any" when no other peer can reach the container.
      # FITFIX_TRUSTED_PROXIES: "any"
      # How many entries that proxy appends to X-Forwarded-For, read from the right: one for a
      # single proxy, two behind Google's front end, which appends the client's address and its
      # own. Too few partitions the rate limit on the proxy; too many start believing the caller.
      # FITFIX_FORWARD_HOPS: "1"

      # How long the service waits for its own answer. A repair gets its own, longer one.
      # FITFIX_TIMEOUT_SECONDS: "30"
      # FITFIX_TIMEOUT_REPAIR_SECONDS: "120"

    # The healthcheck is the image's own: it knows its port and carries the wget to use it,
    # so there is nothing to repeat here.
