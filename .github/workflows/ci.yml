name: CI

# Story 1.1: every push is checked, so the rewrites in the rest of Epic 1
# cannot silently break a result that is already verified by tests.
# Story 2.4 added the frontend job: a frontend nobody builds in CI is a
# frontend that breaks quietly. The two jobs are independent and run in
# parallel — neither builds the other's output.

on:
  push:
  pull_request:
    branches: [main]

# A story branch with an open PR would otherwise run twice per push: `push`
# reports `refs/heads/<branch>` while `pull_request` reports
# `refs/pull/<n>/merge`, so the group has to collapse both onto the PR number.
# On `main` nothing is superseded — every commit there keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # The suite finishes in seconds; anything near this is a hang, not a slow run.
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Follow the same pin as local builds instead of a second source of truth.
          global-json-file: global.json

      - name: Report the resolved SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  web:
    name: Build and test the frontend
    runs-on: ubuntu-latest
    # Install dominates; the build and the tests take seconds.
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        # The dictionary test reads src/FitFix.Core/Diagnostics/DiagnosticCodes.cs, so this
        # job needs the whole repository rather than web/ alone.

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # The version used locally. Dependabot moves this, not a guess per run.
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Type-check
        run: npm run typecheck
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      # The dictionary equality of AD-18 lives here: a code added to the core with no
      # Ukrainian text fails this step, which is the point of the whole story.
      - name: Test
        run: npm run test
        working-directory: web
